# ==============================================================================
# @file         docker-compose.prod.yml
# @description  Production environment for the User CRUD API.
#               Runs the optimized production image and PostgreSQL 17.
# ==============================================================================

services:
  api:
    build:
      context: .
      target: prod
    container_name: user-crud-api
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8000}:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    networks:
      - app-network

  postgres:
    image: postgres:17
    container_name: user-crud-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge