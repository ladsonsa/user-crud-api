# ==============================================================================
# @file         docker-compose.yml
# @description  Multi-container orchestration setup for the User CRUD API,
#               integrating a Python/Uvicorn backend service with a PostgreSQL database.
# @services     
#   - api       : FastAPI/Uvicorn application container with live-reload volume mapping.
#   - postgres  : PostgreSQL 17 relational database with health-check readiness.
# 
# @prerequisites:
#   - Copy the template `.env.example` to `.env` and configure environment variables.
#
# @usage:
#   1. Start services in detached mode:
#      docker compose up -d --build
#   2. View service logs:
#      docker compose logs -f api
#   3. Tear down containers and volumes:
#      docker compose down -v
# ==============================================================================

services:
  api:
    build: .
    container_name: user-crud-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:17
    container_name: user-crud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: